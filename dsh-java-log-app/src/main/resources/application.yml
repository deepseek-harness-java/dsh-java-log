server:
  port: 8093

spring:
  application:
    name: dsh-java-log
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: non_null

dsh:
  log:
    data-directory: ${user.home}/.dsh-java-log
    command-timeout-seconds: 20
    max-log-lines: 200000
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}
